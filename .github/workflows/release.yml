name: Release

# Publishes core, kit and pack-core to npm when a version tag is pushed, and
# only then: the tag must match every package's version.
# Needs an NPM_TOKEN secret with publish rights to the @eve-fabric scope.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: The tag matches every package's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for pkg in core kit pack-core; do
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "v$version" != "$TAG" ]; then
              echo "packages/$pkg is $version, but the tag is $TAG"
              exit 1
            fi
          done
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm run test:bank
      - run: pnpm run packages:check
      - run: >-
          pnpm --filter @eve-fabric/core --filter @eve-fabric/kit --filter @eve-fabric/pack-core
          publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
