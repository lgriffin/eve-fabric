name: Release

# Publishes core, kit and pack-core to npm when a version tag is pushed.
# Needs an NPM_TOKEN secret with publish rights to the @eve-fabric scope.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run packages:check
      - run: >-
          pnpm --filter @eve-fabric/core --filter @eve-fabric/kit --filter @eve-fabric/pack-core
          publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
