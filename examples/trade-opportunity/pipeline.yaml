id: trade.opportunity
version: 1
name: Trade Opportunity
description: >
  Finds market data for an item in a region and calculates the route
  distance between two trade hubs. Uses only capabilities registered
  in the gateway catalog.

inputs:
  - name: region
    semanticType: eve.region.reference
    description: Market region to query
    required: true
  - name: item
    semanticType: eve.type.reference
    description: Item type to look up
    required: true
  - name: origin
    semanticType: eve.system.reference
    description: Origin solar system
    required: true
  - name: destination
    semanticType: eve.system.reference
    description: Destination solar system
    required: true

nodes:
  - id: fetchOrders
    capability:
      id: market.orders
      version: 1.0.0
    defaults:
      region:
        value: 10000002
        label: The Forge
      item:
        value: 34
        label: Tritanium

  - id: aggregateMarket
    capability:
      id: market.aggregate
      version: 1.0.0

  - id: routeCalc
    capability:
      id: route.distance
      version: 1.0.0
    defaults:
      origin:
        value: 30000142
        label: Jita
      destination:
        value: 30002187
        label: Amarr

edges:
  - from: input.region
    to: fetchOrders.region
  - from: input.item
    to: fetchOrders.item
  - from: fetchOrders.orders
    to: aggregateMarket.orders
  - from: input.origin
    to: routeCalc.origin
  - from: input.destination
    to: routeCalc.destination

outputs:
  - name: orders
    source: fetchOrders.orders
  - name: lowestSell
    source: aggregateMarket.lowestSell
  - name: highestBuy
    source: aggregateMarket.highestBuy
  - name: routeDistance
    source: routeCalc.distance
