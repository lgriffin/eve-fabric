id: route.info
version: 1
name: RouteInfo
description: >
  Calculates route information between two solar systems, resolving
  each system reference and computing distance, jump count, and
  security ratings along the path.

inputs:
  - name: origin
    semanticType: eve.system.reference
    description: Origin solar system
    required: true
  - name: destination
    semanticType: eve.system.reference
    description: Destination solar system
    required: true

nodes:
  - id: resolveOrigin
    capability:
      id: universe.resolve.solar.system
      version: 2.0.0

  - id: resolveDestination
    capability:
      id: universe.resolve.solar.system
      version: 2.0.0

  - id: calculateRoute
    capability:
      id: route.distance
      version: 2.0.0

edges:
  - from: input.origin
    to: resolveOrigin.query
  - from: input.destination
    to: resolveDestination.query
  - from: resolveOrigin.system
    to: calculateRoute.origin
  - from: resolveDestination.system
    to: calculateRoute.destination

outputs:
  - name: jumps
    source: calculateRoute.distance
  - name: originSystem
    source: resolveOrigin.system
  - name: destinationSystem
    source: resolveDestination.system
