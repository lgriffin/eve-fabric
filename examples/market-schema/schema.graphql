"""Reference to an EVE item type ID"""
scalar TypeReference

"""Reference to an EVE region ID"""
scalar RegionReference

"""EVE Online ISK currency amount"""
scalar ISK

enum DataSource {
  ESI
  SDE
  DERIVED
  CACHE
}

type DataProvenance {
  source: DataSource!
  capability: String!
  version: Int!
  retrievedAt: String
  calculatedAt: String
  cached: Boolean!
}

type MarketOrder {
  price: ISK!
  volume: Int!
  location: String!
  _provenance: DataProvenance
}

type MarketSummary {
  avgPrice: ISK!
  minPrice: ISK!
  maxPrice: ISK!
  totalVolume: Int!
  _provenance: DataProvenance
}

type MarketSnapshotResult {
  orders: [MarketOrder]!
  summary: MarketSummary!
  _provenance: DataProvenance
}

input MarketSnapshotInput {
  typeId: TypeReference!
  regionId: RegionReference!
}

type Query {
  marketSnapshot(input: MarketSnapshotInput!): MarketSnapshotResult!
}
